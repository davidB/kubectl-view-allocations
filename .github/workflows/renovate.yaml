name: renovate

on:
  workflow_dispatch:
  schedule:
    # weekly, every Friday (automerge of PRs with passing checks happens on the next run)
    - cron: "0 2 * * 5"

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'davidB' }}
    steps:
      - uses: actions/checkout@v7
      - uses: renovatebot/github-action@v46.3.15
        with:
          # a PAT (or GitHub App token) is required: PRs created with GITHUB_TOKEN don't trigger the ci workflow
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          # commit as the owner of RENOVATE_TOKEN instead of the default renovate@whitesourcesoftware.com (owned by Mend)
          RENOVATE_GIT_AUTHOR: "Renovate Bot <10675+davidB@users.noreply.github.com>"
